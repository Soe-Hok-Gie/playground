name: CI Playground

on:
  push:
    branches: ["main"]

jobs:
  fitur-ci:
  runs-on: ubuntu-lates
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.22"

    - name: Install Dependensi
      uses: go mod download

    - name: Run Unit Test
      uses: go test -v ./...
